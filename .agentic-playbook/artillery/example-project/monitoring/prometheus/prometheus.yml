global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "target-server"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "target-server:3000"
        labels:
          service: "target-server"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"
        labels:
          service: "prometheus"
