networks:
  n8n-workflow:

x-n8n: &service-n8n
  image: n8nio/n8n:2.41.3
  networks: ['n8n-workflow']
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST:?DB_POSTGRESDB_HOST is required}
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_USER=postgres
    - DB_POSTGRESDB_DATABASE=n8n
    - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD:?DB_POSTGRESDB_PASSWORD is required}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
    - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET:?N8N_USER_MANAGEMENT_JWT_SECRET is required}
    - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
    - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser

services:
  n8n-import:
    <<: *service-n8n
    profiles: [import]
    container_name: n8n-import
    entrypoint: /bin/sh
    command:
      - "-c"
      - "n8n import:credentials --separate --input=/backup/credentials && n8n import:workflow --separate --input=/backup/workflows"
    volumes:
      - ${VOLUME_DIR_N8N:?VOLUME_DIR_N8N is required}/backup:/backup

  n8n:
    <<: *service-n8n
    container_name: n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - ${VOLUME_DIR_N8N:?VOLUME_DIR_N8N is required}/n8n_storage:/home/node/.n8n
      - ${VOLUME_DIR_N8N:?VOLUME_DIR_N8N is required}/backup:/backup
      - ${VOLUME_DIR_N8N:?VOLUME_DIR_N8N is required}/data/shared:/data/shared
