[project]
name = "langgraph-fast"
version = "0.1.0"
description = "Minimal FastAPI and LangGraph service starter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "langgraph>=0.6.0",
  "neo4j>=5.26.0",
  "openai>=1.93.0",
  "pydantic>=2.11.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "langgraph-cli[inmem]>=0.4.30",
  "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/domains",
  "src/graph",
  "src/infrastructure",
  "src/server",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
