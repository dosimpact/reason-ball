global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: neo4j-exporter
    static_configs:
      - targets: ["neo4j-exporter:9412"]

  - job_name: neo4j
    metrics_path: /probe
    params:
      module: [default]
    static_configs:
      - targets: ["neo4j:7687"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: neo4j-exporter:9412
