[project]
name = "chatgpt-oauth-proxy"
version = "0.1.0"
description = "Standalone ChatGPT OAuth proxy for Codex-compatible local OpenAI API calls"
requires-python = ">=3.10"
dependencies = [
    "aiohttp~=3.11.13",
]

[dependency-groups]
dev = [
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "openai>=1.0.0",
]

[tool.uv]
package = false
