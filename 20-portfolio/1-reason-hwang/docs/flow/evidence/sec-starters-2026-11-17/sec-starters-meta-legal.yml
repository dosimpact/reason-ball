                    - paragraph [ref=e1078]: Trial in the first of the personal injury cases began on January 27, 2026 in Judicial Council Coordination Proceeding No. 5255 pending in Los Angeles County California Superior Court. Trial in the first of the state attorneys general cases is currently scheduled to begin on February 2, 2026 in the First Judicial District Court of New Mexico, in a case brought by the New Mexico Attorney General. Trials in other state attorneys general cases are currently scheduled or expected to be scheduled in the second half of 2026 or in 2027.
