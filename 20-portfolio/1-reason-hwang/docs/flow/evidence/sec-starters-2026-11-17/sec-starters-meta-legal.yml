                  - blockquote [ref=e1055]:
                    - generic [ref=e1056]: Item 3 · 전반적인 소송·규제 환경 및 잠재적 금전 노출
                    - paragraph [ref=e1057]: Item 3. Legal Proceedings As a multinational company with a complex and evolving business, we are, and expect to continue to be, subject to numerous claims, litigation, regulatory, tax, and government inquiries and investigations, and other legal proceedings in jurisdictions around the world. Although we believe many of these matters are without merit and are vigorously defending them, we may not be successful. Any litigation to which we are a party may be resolved adversely or we may be subject to an unfavorable judgment that may not be reversed upon appeal. We may also decide to settle litigation, disputes, or other legal proceedings in some instances on terms that are unfavorable to us.
                  - blockquote [ref=e1058]:
                    - generic [ref=e1059]: Item 3 · 개인정보 관련 집단소송 및 FTC 동의명령
                    - paragraph [ref=e1060]: nspecified damages and injunctive relief. With respect to the putative class actions alleging fraud and violations of consumer protection, privacy, and other laws in connection with the same matters, several of the cases brought on behalf of consumers in the United States were consolidated in the U.S. District Court for the Northern District of California ( In re Facebook, Inc., Consumer Privacy User Profile Litigation ). On December 22, 2022, the parties entered into a settlement agreement to resolve the lawsuit, which provided for a payment of $725 million by us and became final on May 14, 2025.
                  - blockquote [ref=e1061]:
                    - generic [ref=e1062]: Item 3 · FTC 동의명령 수정 절차 및 관련 법원 사건
                    - paragraph [ref=e1063]: On May 3, 2023, the FTC filed a public administrative proceeding ( In the Matter of Facebook, Inc. ) seeking substantial changes to the modified consent order, which took effect in April 2020 after its entry by the U.S. District Court for the District of Columbia. The changes sought by the FTC are set forth in a proposed order and include, among others, a prohibition on our use of minors' data for any commercial purposes, changes to the composition of our board of directors, and significant limitations on our ability to modify and launch new products. On May 31, 2023, we filed a motion before the U.S.
                  - blockquote [ref=e1064]:
                    - generic [ref=e1065]: Item 3 · 아일랜드 개인정보보호위원회의 GDPR 데이터 이전 결정
                    - paragraph [ref=e1066]: In addition, on May 12, 2023, the IDPC issued a Final Decision concluding that Meta Platforms Ireland's reliance on Standard Contractual Clauses in respect of certain transfers of European Economic Area (EEA) Facebook user data was not in compliance with the GDPR. The IDPC issued an administrative fine of EUR €1.2 billion as well as corrective orders requiring Meta Platforms Ireland to suspend the relevant transfers and to bring its processing operations into compliance with Chapter V GDPR by ceasing the unlawful processing, including storage, of such data in the United States. We are appealing this Final Decision and it is currently subject to a stay from the Irish High Court.
                  - blockquote [ref=e1067]:
                    - generic [ref=e1068]: Item 3 · 비즈니스 도구 및 픽셀 데이터 관련 개인정보 소송
                    - paragraph [ref=e1069]: These cases are in different stages, but several of our motions to dismiss have been denied in whole or in part, while certain others have been granted in whole or in part. In Rickwalder , the Superior Court denied plaintiffs' motion for class certification and the plaintiffs have appealed that decision. In Flo Health , on August 1, 2025, a jury returned a verdict on liability in favor of the plaintiffs and on behalf of a California subclass on the sole claim remaining against Meta under Section 632 of the California Invasion of Privacy Act. Plaintiffs are seeking $5,000 in statutory damages per class member and have asserted that there are up to approximately 1.6 million class members.
                  - blockquote [ref=e1070]:
                    - generic [ref=e1071]: Item 3 · 미국 FTC 반독점 사건 및 관련 집단소송
                    - paragraph [ref=e1072]: On August 19, 2021, the FTC filed an amended complaint, and on October 4, 2021, we filed a motion to dismiss this amended complaint. On January 11, 2022, the court denied our motion to dismiss the FTC's amended complaint. On April 5, 2024, we filed our motion for summary judgment and the FTC filed its opposition and its own motion for partial summary judgment on May 24, 2024. On November 13, 2024, the court granted in part and denied in part both our and the FTC's motions for summary judgment. Trial began on April 14, 2025 and concluded on May 27, 2025. On November 18, 2025, the court granted judgment in our favor. On January 20, 2026, the FTC filed a notice of appeal of that ruling.
                  - blockquote [ref=e1073]:
                    - generic [ref=e1074]: Item 3 · 유럽 경쟁법 절차 및 미디어 기업 소송
                    - paragraph [ref=e1075]: We are also subject to litigation in Europe brought by news and media companies alleging anticompetitive conduct in relation to aspects of our historic data processing practices. For example, on December 1, 2023, 87 news media companies filed a joint action against us in Spain in relation to our legal basis under the GDPR for behavioral advertising, alleging unfair competition and abuse of dominance ( Asociacion de Medios de Informacion (AMI) v. Meta Ireland ). On November 19, 2025, the court issued judgment against us, finding that AMI had failed to establish abuse of dominance but upholding its case on unfair competition and awarding damages of approximately EUR €542 million.
                  - blockquote [ref=e1076]:
