                    - paragraph [ref=e1081]: On June 25, 2025, the court granted our motion for summary judgment on fair use as to the named plaintiffs in the case. The parties will proceed to brief the remaining claim of copyright infringement due to alleged distribution of books to third parties during the downloading process. The court is scheduled to hear summary judgment motions on July 16, 2026. Beginning in November 2025, additional cases with similar claims were filed against us in the U.S. District Court for the Northern District of California ( Entrepreneur Media v. Meta Platforms, Inc., Carreyrou et al. v. Anthropic PBC, et al. and TED Entertainment, Inc. v. Meta Platforms, Inc .).
