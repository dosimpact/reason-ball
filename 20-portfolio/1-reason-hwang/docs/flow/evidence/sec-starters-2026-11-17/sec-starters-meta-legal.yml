                  - heading "핵심 요약" [level=2] [ref=e925]
                  - paragraph [ref=e926]: Meta는 전 세계에서 개인정보, 경쟁법, 청소년 안전, 저작권, 광고·소비자보호와 관련된 소송·규제조사를 받고 있다고 공시합니다. 일부 절차는 이미 수십억 달러의 합의금·벌금 또는 수억 유로의 손해배상으로 이어졌고, 향후 금전배상뿐 아니라 제품·데이터 관행 변경, 구조적·행태적 구제까지 발생할 수 있습니다.
