                    - paragraph [ref=e945]: FTC는 미성년자 데이터의 상업적 이용 금지, 이사회 구성 변경, 신제품 수정·출시 제한 등을 포함한 추가 요구를 추진했습니다. 관련 관할권 소송에서 항소법원은 2025년 5월 절차적 사유로 하급심 결정을 뒤집고 환송했습니다. 2026년 1월 20일 법원은 사건을 계속 중지하고 2026년 6월 8일까지 진행상황을 제출하도록 했습니다.
