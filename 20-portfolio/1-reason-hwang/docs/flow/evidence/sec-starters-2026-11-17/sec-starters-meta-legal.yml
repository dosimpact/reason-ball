                    - paragraph [ref=e933]: 이용자 데이터 오용 관련 미국 집단소송은 7억 2,500만 달러 지급 합의로 해결되었고, 합의는 2025년 5월 14일 확정되었습니다. 별도의 FTC 합의·수정 동의명령은 50억 달러 벌금과 개인정보 보호 통제 강화를 요구했습니다. 캘리포니아 합의는 법원 승인을 조건으로 하며, 일부 주·해외 조사는 계속 중입니다.
