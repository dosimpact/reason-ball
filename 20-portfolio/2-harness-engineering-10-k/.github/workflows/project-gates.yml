name: Project Gates

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_graph_rag:
        description: "Run live SEC parser-to-Graph-RAG smoke"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: read

concurrency:
  group: project-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Doctor Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static, build, lint, and unit gates
        run: pnpm run doctor:verify

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @10k/chatbot exec playwright install --with-deps chromium

      - name: Run browser E2E gate
        run: pnpm run test:e2e

  graph-rag:
    name: Live Graph RAG Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: quality
    if: github.event_name == 'schedule' || github.event.inputs.run_graph_rag == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run live SEC parser-to-Graph-RAG smoke
        run: pnpm run test:graph-rag
