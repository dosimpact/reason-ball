# 이 백엔드만의 Python 버전·의존성·검사 도구·패키징 설정입니다. 재현 가능한 설치 버전은 uv.lock으로 고정합니다.
[project]
name = "openui-langgraph-python"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anyio>=4.15.1",
  "beautifulsoup4>=4.15.0",
  "deepagents==0.7.28",
  "httpx>=0.28.1",
  "langchain-openai==1.7.2",
  "langgraph==1.2.16",
  "langgraph-api==0.16.1",
  "langgraph-cli[inmem]==0.4.36",
  "openai>=3.35.1",
  "pydantic>=2.14.1",
  "pypdf>=6.21.1",
  "python-dotenv>=1.2.4",
  "starlette>=1.8.0",
]

[project.scripts]
prepare-documents = "agent.prepare_documents:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
agent = ["system-prompt.txt"]
