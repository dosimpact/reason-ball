      - heading "7. 실행과 검증" [level=2] [ref=f2e187]
      - generic [ref=f2e188]: "# backend-langgraph uv sync --frozen uv run langgraph dev --port 2041 --no-browser # frontend npm ci npm run dev # http://127.0.0.1:3049 # Catalog change npm run generate cp src/shared/ui/openui/generated/system-prompt.txt ../backend-langgraph/agent/system-prompt.txt # Restart backend after prompt asset changes # Checks uv run pytest uv run ruff check agent tests npm test npm run typecheck npm run lint npm run verify"
      - paragraph [ref=f2e189]: 루트 .env 및 백엔드 .env는 서버에서만 읽습니다. SQLite 파일, 원문 PDF, 키, 캐시는 Git에 올리지 않습니다. 기존 서버를 재사용하거나 종료하지 않고 이 프로젝트의 포트를 사용합니다.
      - paragraph [ref=f2e190]: 검증은 정적 검사, 단위 테스트, 실제 공급자/API 호출, 브라우저 사용자 흐름으로 나누어 기록합니다. 과거 6-5의 성공 기록은 이번 프로젝트의 성공 증거가 아닙니다.
    - generic [ref=f2e191]:
      - heading "8. 내보내기와 지원 범위" [level=2] [ref=f2e192]
      - paragraph [ref=f2e193]: JSON은 패널·조회 조건·배치·출처를 담습니다. CSV는 재무 행과 일반 패널의 프로그램을 포함합니다. PDF는 브라우저 인쇄에서 저장하며, 생성 중인 답변은 완료한 후 내보내는 것이 좋습니다.
      - paragraph [ref=f2e194]: 로컬 단일 사용자 앱입니다. 공개 배포 인증, 다중 사용자 협업, OCR은 별도 범위입니다. SEC 오류와 자료 부족은 화면에서 안내하며 성공으로 위장하지 않습니다.
