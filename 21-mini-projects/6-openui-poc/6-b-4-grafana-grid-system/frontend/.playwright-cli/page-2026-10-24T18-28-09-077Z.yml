    - generic [ref=f2e114]:
      - heading "3. 숫자와 문장의 근거" [level=2] [ref=f2e115]
      - list [ref=f2e116]:
        - listitem [ref=f2e117]: "공시 수집: 기업을 CIK로 식별하고 Submissions에서 공시를 찾은 뒤 원문을 저장합니다. 다운로드 실패와 준비 완료를 구분합니다."
        - listitem [ref=f2e118]: "섹션: Item별 원문과 위치를 보관합니다. 추출에 실패한 섹션을 임의로 만들지 않고 전체 원문을 확인할 수 있게 합니다."
        - listitem [ref=f2e119]: "검색: 기존 PDF의 페이지별 벡터와 SEC 원문의 섹션별 벡터를 SQLite에 저장합니다. 유사도는 근거의 순위를 뜻하며 사실 부재의 확정이 아닙니다."
        - listitem [ref=f2e120]: "연간 수치: XBRL의 연간 기간, 통화·단위, 원래 공시와 정정 공시를 구분합니다. 누락 연도는 0으로 채우지 않으며 연도가 연속되지 않으면 YoY를 계산하지 않습니다."
      - paragraph [ref=f2e121]: 현재 환경의 SEC 직접 접근은 403을 반환했습니다. 모델·임베딩 호출은 확인했지만, 최신 원문 수집 성공 여부는 별도 검증해야 합니다. 준비된 PDF 비교와 Canvas 작업은 독립적으로 진행할 수 있습니다.
    - generic [ref=f2e122]:
      - heading "4. Canvas 상태가 일관되는 이유" [level=2] [ref=f2e123]
      - paragraph [ref=f2e124]: 브라우저와 에이전트는 같은 패널 명령을 사용합니다. 패널 ID는 계속 유지되며, 제목 변경이나 기간 확장으로 다른 패널을 만들지 않습니다.
      - list [ref=f2e125]:
        - listitem [ref=f2e126]: 현재 대화의 대시보드와 revision을 읽습니다.
        - listitem [ref=f2e127]: 변경 명령에 operation ID와 base revision을 붙입니다.
        - listitem [ref=f2e128]: 서버가 스키마·고정·참조·충돌을 검사하고 SQLite에 저장합니다.
        - listitem [ref=f2e129]: AG-UI STATE_SNAPSHOT 또는 STATE_DELTA로 화면을 갱신합니다.
      - paragraph [ref=f2e130]: 이미 처리한 명령은 중복 적용하지 않습니다. 사용자가 먼저 변경했다면 오래된 명령을 거절하고 현재 상태를 다시 읽습니다. 패널을 지워도 원문 보고서와 대화는 남습니다.
