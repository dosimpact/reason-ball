[project]
name = "analytics-template-langgraph-backend"
version = "0.1.0"
description = "LangGraph Python backend for the analytics template UI generative demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.124.0",
  "httpx>=0.28.0",
  "langchain-openai>=1.1.0",
  "langgraph>=1.0.5",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.12.0",
  "python-dotenv>=1.2.0",
  "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
