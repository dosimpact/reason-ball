[project]
name = "langchain-lecture"
version = "0.1.0"
description = "Reorganized uv workspace for LangChain lecture examples."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "certifi>=2024.0.0",
    "faiss-cpu>=1.12.0",
    "fastapi>=0.115.0",
    "langchain>=1.0.0",
    "langchain-chroma>=1.0.0",
    "langchain-classic>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-core>=1.0.0",
    "langchain-experimental>=0.4.0",
    "langchain-ollama>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-pinecone>=0.2.0",
    "langchain-tavily>=0.2.0",
    "langchain-text-splitters>=1.0.0",
    "langchain-unstructured>=1.0.0",
    "langgraph>=1.0.0",
    "langchainhub>=0.1.21",
    "ollama>=0.6.0",
    "pandas>=2.3.0",
    "pillow>=11.0.0",
    "pypdf>=6.0.0",
    "python-dotenv>=1.0.0",
    "qrcode>=8.0",
    "streamlit>=1.40.0",
    "streamlit-chat>=0.1.1",
    "tabulate>=0.9.0",
    "tavily-python>=0.7.0",
    "tiktoken>=0.8.0",
    "tqdm>=4.66.0",
    "unstructured>=0.18.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.0",
    "pytest>=8.0.0",
]

[project.scripts]
langchain-lecture = "langchain_lecture.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
