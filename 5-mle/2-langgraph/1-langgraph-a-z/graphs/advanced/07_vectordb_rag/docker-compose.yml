services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: lg07-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - lg07_qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lg07_qdrant:
