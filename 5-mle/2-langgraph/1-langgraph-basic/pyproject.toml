[project]
name = "langgraph-basic-openai"
version = "0.1.0"
description = "LangGraph examples backed by the OpenAI API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=0.3.0",
    "langgraph-cli[inmem]>=0.3.0",
    "langsmith>=0.3.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
advanced = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "numpy>=1.26.0",
    "psycopg[binary]>=3.2.0",
    "python-jose[cryptography]>=3.3.0",
    "qdrant-client>=1.12.0",
    "rank-bm25>=0.2.2",
    "sse-starlette>=2.1.0",
    "uvicorn>=0.34.0",
]
local-embeddings = [
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
